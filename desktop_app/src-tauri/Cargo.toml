[package]
name = "aura_studio"
version = "2.4.0"
description = "AURA Studio: Real-time Agentic Desktop Environment"
authors = ["shura"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
