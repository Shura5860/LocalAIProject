[package]
name = "vector_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "vector_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
instant-distance = "0.6"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
serde_json = "1.0"