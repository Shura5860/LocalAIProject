name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    name: Python Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f Rust-Python-Vector-Engine/requirements.txt ]; then
            pip install -r Rust-Python-Vector-Engine/requirements.txt
          fi
          pip install psutil httpx duckduckgo_search sentence-transformers

      - name: Run Unit Tests
        run: |
          python -m unittest discover Rust-Python-Vector-Engine/tests -v
