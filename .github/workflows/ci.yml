name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    name: Python Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Python & Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin "httpx[http2]" duckduckgo_search sentence-transformers psutil fastapi uvicorn
          if [ -f Rust-Python-Vector-Engine/requirements.txt ]; then
            pip install -r Rust-Python-Vector-Engine/requirements.txt || true
          fi

      - name: Build and Install Native Rust Vector Engine
        run: |
          pip install ./Rust-Python-Vector-Engine/vector_engine

      - name: Run Unit Tests
        run: |
          cd Rust-Python-Vector-Engine
          PYTHONPATH=. python -m unittest discover tests -v
